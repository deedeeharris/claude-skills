name: Telegram Session Bridge

on:
  push:
    paths:
      - 'skills/telegram-session-bridge/**'
      - '.github/workflows/telegram-session-bridge.yml'
  pull_request:
    paths:
      - 'skills/telegram-session-bridge/**'
      - '.github/workflows/telegram-session-bridge.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: skills/telegram-session-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint and formatting
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          python -m compileall -q scripts
      - name: Build distributions
        run: |
          python scripts/build_skill_zip.py
          python scripts/build_source_zip.py
          python -m build
