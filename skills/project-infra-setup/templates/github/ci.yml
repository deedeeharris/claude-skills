name: CI

# Baseline CI. The JOB NAMES below are the required status checks in ruleset-main.json.
# Rename a job here -> rename it there (run verify-required-checks.py). Never put a matrix on a required job
# (a matrix changes the check name to "job (value)"), and never path-filter a required job at workflow level
# (a check that never runs leaves the PR blocked forever).
# Default stack = Node (npm). For another stack replace the runtime setup step (setup-node with .nvmrc and its npm cache:
# setup-python, setup-go, ...), the package guards and the `run:` lines; keep the job names.
# React or monorepo extras (sharded Playwright E2E, Storybook build, one aggregate "all green" job) are not covered here:
# add them as extra jobs and, if they must block merges, add their job names to ruleset-main.json too.
#
# DAY 0: every required job below still runs and reports on the bootstrap PR, before any app exists. The package-dependent
# steps are guarded by `if: hashFiles('package-lock.json') != ''` and the job prints a visible "no app yet" notice
# instead. Jobs keep their names, so the required checks exist and go green. WHEN THE APP SCAFFOLD LANDS, delete every
# `if: hashFiles(...)` line and the "no app yet" steps: otherwise deleting the lockfile would silently pass the checks.
# (A non-Node stack replaces the guard with its own marker file, for example pyproject.toml or go.mod.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: no app yet
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet (no app scaffold) so lint has nothing to check. Remove this guard when the scaffold lands."
      - uses: actions/setup-node@v7
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: no app yet
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet (no app scaffold) so typecheck has nothing to check. Remove this guard when the scaffold lands."
      - uses: actions/setup-node@v7
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm run typecheck --if-present

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: no app yet
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet (no app scaffold) so test has nothing to check. Remove this guard when the scaffold lands."
      - uses: actions/setup-node@v7
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm test --if-present

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: no app yet
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet (no app scaffold) so build has nothing to check. Remove this guard when the scaffold lands."
      - uses: actions/setup-node@v7
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: no app yet
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::No package-lock.json yet (no app scaffold) so dependency-audit has nothing to check. Remove this guard when the scaffold lands."
      - uses: actions/setup-node@v7
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks container, no license needed. Scans full history; --redact keeps values out of the log.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner --verbose
