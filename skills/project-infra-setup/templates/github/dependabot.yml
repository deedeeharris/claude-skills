# Weekly, grouped. Day 0: ONLY github-actions is active, because Dependabot reports a config error for an ecosystem
# whose directory does not exist yet. Uncomment npm (or your stack's ecosystem) at the scaffold step, once the
# manifest exists, and terraform at the Terraform step, once terraform/envs/dev exists. Delete what the repo never uses.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

